experiment: 2
eid: "exp_01m1rc45nwevdtjx8af5xk0pk0"
title: "Arm B: is 4/3 an AdamW number, or does any optimizer get it?"
date: "2026-09-05"
status: complete

data:
  model: "state-spaces/mamba3-siso-187m@6792c27c00f3bb41506db1066dcd1c51bb0f4b02"
  dataset: "openai/gsm8k main/train, rows in recorded order, batch 1, max 512 tokens"
  prompt_template: |
    <|begin_of_text|>Question:\n{question}\n\nAnswer:\n{answer}<|end_of_text|>
  prompt_provenance: >-
    Recovered from the recorded captures' stored token ids, not guessed;
    re-encoding row 99 reproduces the recorded 230 ids exactly.
    See results/data_pipeline.json.
  seed: 1234
  image: "docker.io/juiceboxdocks/mamba3-atlas:1cde57a2d4981702add8c542ec75c7b2282b2ce3"
  reference_run: "20260810T091311Z (reference/capture_summary_clip1.jsonl)"

outputs:
  artifact_root: "artifact://juiceb0xc0de-15787e/experiments/exp_01m1rc45nwevdtjx8af5xk0pk0/"
  per_run_records: "armb_<condition>_<label>.json (~5.3 MB each) and .rows.jsonl"
  job_logs: "log_adamw_native.txt, log_scale_matched_v2.txt, log_muon_lrscan.txt"
  preflight: "preflight_adamw.json, preflight_interactive.json"
  joined_tables:
